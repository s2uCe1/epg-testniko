name: Update EPG Daily

on:
  schedule:
    # 01:00 UTC corresponds to 03:00 AM CEST (Croatia local time)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python combine_epg.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add combined_epg.xml.gz
          git diff --staged --quiet || (git commit -m "Update combined EPG [skip ci]" && git push)
